workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Setup Project and Fix Android SDK Version
        script: |
          flutter create . --org com.store.app --project-name smart_store
          cd android
          perl -pi -e 's/compileSdk = .*/compileSdk = 34/g' app/build.gradle || true
          perl -pi -e 's/compileSdkVersion .*/compileSdkVersion 34/g' app/build.gradle || true
          cd ..
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
