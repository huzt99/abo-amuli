workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Clean and Generate Fresh Project
        script: |
          rm -rf android ios linux macos windows web
          flutter create . --org com.store.app --project-name smart_store
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
