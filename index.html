<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة المكعبات والشهيرة - شبيهة ماينكرافت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }

        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 20px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            direction: rtl;
        }
        #instructions h2 { font-size: 1.1rem; margin-bottom: 8px; color: #4cd137; }
        #instructions p { font-size: 0.85rem; margin-bottom: 4px; }

        #inventory {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px;
            border-radius: 8px;
            z-index: 10;
        }
        .slot {
            width: 45px;
            height: 45px;
            border: 2px solid #555;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            font-size: 0.8rem;
        }
        .slot.active {
            border-color: #fbc531;
            transform: scale(1.1);
        }
    </style>
    <!-- تحميل مكتبة Three.js و PointerLockControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="instructions">
        <h2>⛏️ تحكم اللعبة</h2>
        <p>• <b>انقر على الشاشة</b> لبدء اللعب والتحكم بالماوس.</p>
        <p>• <b>WASD</b> أو <b>الأسهم</b>: الحركة</p>
        <p>• <b>Space</b>: القفز</p>
        <p>• <b>النقرة اليسرى</b>: هدم بلوك</p>
        <p>• <b>النقرة اليمنى</b>: بناء بلوك</p>
        <p>• <b>الأرقام (1-4)</b>: تغيير نوع البلوك</p>
    </div>

    <div id="inventory">
        <div class="slot active" id="slot-1" style="background: #4cd137;">1<br>عشب</div>
        <div class="slot" id="slot-2" style="background: #784e2d;">2<br>خشب</div>
        <div class="slot" id="slot-3" style="background: #10ac84;">3<br>ورق</div>
        <div class="slot" id="slot-4" style="background: #718093;">4<br>حجر</div>
    </div>

    <script>
        // 1. إعداد المشهد والكاميرا
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // لون السماء
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 2. خامات الألوان للمكعبات
        const materials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x4cd137 }),
            wood: new THREE.MeshLambertMaterial({ color: 0x784e2d }),
            leaves: new THREE.MeshLambertMaterial({ color: 0x10ac84 }),
            stone: new THREE.MeshLambertMaterial({ color: 0x718093 })
        };

        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        const blocks = []; // مصفوفة لتخزين البلوكات المبنوبة للتحقق من التصادم والتفاعل
        let selectedBlockType = 'grass';

        // دالة إنشاء بلوك
        function createBlock(x, y, z, type) {
            const mesh = new THREE.Mesh(blockGeometry, materials[type]);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { type: type };
            scene.add(mesh);
            blocks.push(mesh);
            return mesh;
        }

        // 3. إنشاء العالم الابتدائي (الأرض والأشجار)
        const worldSize = 20;
        for (let x = -worldSize; x <= worldSize; x++) {
            for (let z = -worldSize; z <= worldSize; z++) {
                // الأرضية
                createBlock(x, 0, z, 'grass');

                // زراعة أشجار بشكل عشوائي
                if (Math.random() < 0.02 && Math.abs(x) > 3 && Math.abs(z) > 3) {
                    createTree(x, 1, z);
                }
            }
        }

        function createTree(x, y, z) {
            // خشب الشجرة
            for (let i = 0; i < 4; i++) {
                createBlock(x, y + i, z, 'wood');
            }
            // أوراق الشجرة
            for (let lx = -1; lx <= 1; lx++) {
                for (let ly = 3; ly <= 4; ly++) {
                    for (let lz = -1; lz <= 1; lz++) {
                        if (!(lx === 0 && lz === 0 && ly === 3)) {
                            createBlock(x + lx, y + ly, z, 'leaves');
                        }
                    }
                }
            }
        }

        // 4. تحكم الكاميرا وحركة اللاعب
        camera.position.set(0, 2, 5);

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        let velocityY = 0;
        const gravity = -0.015;

        // القفل بالماوس (Pointer Lock)
        let isLocked = false;
        document.body.addEventListener('click', () => {
            if (!isLocked) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === document.body;
        });

        // حركة الماوس لتصويب الكاميرا
        let yaw = 0, pitch = 0;
        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;

            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;

            pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));

            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        });

        // أحداث اللوحة (أزرار الحركة)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
            if (e.code === 'Space' && canJump) {
                velocityY = 0.25;
                canJump = false;
            }

            // اختيار نوع البلوك بالأرقام
            if (['1', '2', '3', '4'].includes(e.key)) {
                const types = ['grass', 'wood', 'leaves', 'stone'];
                selectedBlockType = types[parseInt(e.key) - 1];
                document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
                document.getElementById(`slot-${e.key}`).classList.add('active');
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
        });

        // 5. البناء والهدم عند النقر بالماوس
        const raycaster = new THREE.Raycaster();
        const centerVector = new THREE.Vector2(0, 0);

        document.addEventListener('mousedown', (e) => {
            if (!isLocked) return;

            raycaster.setFromCamera(centerVector, camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                if (e.button === 0) {
                    // النقرة اليسرى: إزالة بلوك
                    scene.remove(intersect.object);
                    const index = blocks.indexOf(intersect.object);
                    if (index > -1) blocks.splice(index, 1);
                } else if (e.button === 2) {
                    // النقرة اليمنى: إضافة بلوك
                    const position = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(0.5));
                    const newX = Math.round(position.x);
                    const newY = Math.round(position.y);
                    const newZ = Math.round(position.z);

                    createBlock(newX, newY, newZ, selectedBlockType);
                }
            }
        });

        // إلغاء القائمة المنسدلة للزر الأيمن
        document.addEventListener('contextmenu', e => e.preventDefault());

        // 6. حلقة التحديث والتكرار (Game Loop)
        const speed = 0.1;

        function animate() {
            requestAnimationFrame(animate);

            if (isLocked) {
                // حسابه الاتجاهات
                const direction = new THREE.Vector3();
                const frontVector = new THREE.Vector3(0, 0, (moveBackward ? 1 : 0) - (moveForward ? 1 : 0));
                const sideVector = new THREE.Vector3((moveRight ? 1 : 0) - (moveLeft ? 1 : 0), 0, 0);

                direction.subVectors(frontVector, sideVector).normalize().multiplyScalar(speed).applyEuler(new THREE.Euler(0, yaw, 0));

                camera.position.add(direction);

                // الجاذبية والقفز
                camera.position.y += velocityY;
                velocityY += gravity;

                // التوقف عند سطح الأرض (ارتفاع العينين 1.6 فوق بلوك الأرض)
                if (camera.position.y < 1.6) {
                    velocityY = 0;
                    camera.position.y = 1.6;
                    canJump = true;
                }
            }

            renderer.render(scene, camera);
        }

        // ضبط الحجم عند تكبير أو تصغير الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
