name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create MainActivity Automatically
        run: |
          mkdir -p android/app/src/main/java/com/example/pos_system
          echo 'package com.example.pos_system;' > android/app/src/main/java/com/example/pos_system/MainActivity.java
          echo 'import io.flutter.embedding.android.FlutterActivity;' >> android/app/src/main/java/com/example/pos_system/MainActivity.java
          echo 'public class MainActivity extends FlutterActivity {}' >> android/app/src/main/java/com/example/pos_system/MainActivity.java

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
